<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Cookie</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .cookie-value {
            font-size: 18px;
            color: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h2>Cookie Value version 2</h2>
<div id="cookieValue" class="cookie-value">Loading...</div>

<script>
    function getCookie(name) {
        const cookies = document.cookie.split('; ');
        for (const cookie of cookies) {
            const [key, value] = cookie.split('=');
            if (key === name) {
                return decodeURIComponent(value);
            }
        }
        return null;
    }

    const value = getCookie('try');
    const output = document.getElementById('cookieValue');

    if (value) {
        output.textContent = `Value of "try": ${value}`;
    } else {
        output.textContent = 'Cookie "try" not found';
    }
</script>

</body>
</html>
